.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var LS_KEY='cornerstone-rentals-v1';
var BASE_MONTH='2026-09';
var DEFAULT_RATES={water:160,trash:200,wifi:1000};
var A_ORDER=['M','N','O','P','L','K','J','I','H','G','F','E','A','C','B'];
var B_ORDER=['1A','18E','13D','14D','15D','16D','9C','10C','11C','12C','5B','6B','7B','8B'];
var BASE={
  A:{M:344,N:232,O:244,P:135,L:106,K:96,J:448,I:205,H:301,G:475,F:369,E:467,A:304,C:743,B:450},
  B:{'1A':346,'18E':40,'13D':99988,'14D':57,'15D':55,'16D':39,'9C':38,'10C':29,'11C':33,'12C':27,'5B':343,'6B':414,'7B':155,'8B':201}
};
var HOUSE_NAME={A:'Cornerstone A',B:'Cornerstone B'};
var HOUSE_NOTE={A:'old house',B:'new house'};

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s);};
var view=$('#view');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return isNaN(n)?null:n;}
function fmtN(n){return Number(n).toLocaleString('en-US');}
function money(n){return 'KSh '+fmtN(Math.round(n));}
function val(v){return v===null||v===undefined?'':String(v);}
function clone(x){return JSON.parse(JSON.stringify(x));}
function monthId(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function shiftMonth(id,delta){var p=id.split('-').map(Number);return monthId(new Date(p[0],p[1]-1+delta,1));}
function monthLabel(id,short){var p=id.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-GB',{month:short?'short':'long',year:'numeric'});}

function defaultConfig(){
  var units=[];
  A_ORDER.forEach(function(n){units.push({id:'A-'+n,house:'A',name:n,wifi:false});});
  B_ORDER.forEach(function(n){units.push({id:'B-'+n,house:'B',name:n,wifi:true});});
  return {units:units,rates:clone(DEFAULT_RATES)};
}
function normCfg(c){
  var d=defaultConfig();
  if(!c||!Array.isArray(c.units)||!c.units.length)return d;
  var r=c.rates||{};
  return {
    units:c.units.map(function(u){return {id:String(u.id),house:u.house==='B'?'B':'A',name:String(u.name),wifi:!!u.wifi};}),
    rates:{water:num(r.water)!=null?num(r.water):d.rates.water,trash:num(r.trash)!=null?num(r.trash):d.rates.trash,wifi:num(r.wifi)!=null?num(r.wifi):d.rates.wifi}
  };
}
function seedMonth(){
  var entries={};
  Object.keys(BASE).forEach(function(h){Object.keys(BASE[h]).forEach(function(n){entries[h+'-'+n]={cur:BASE[h][n]};});});
  return {entries:entries,rates:clone(DEFAULT_RATES)};
}

/* ---------- state ---------- */
var state={config:defaultConfig(),months:{}};
var nowId=monthId(new Date());
var ui={tab:'billing',house:'A',month:nowId,histUnit:null};
var mode='local', dbh=null, ready=false, readOnly=false;
var sb=null, sbSession=null, sbChecking=false;
var pendingBackup=null;
function makeBackup(){return JSON.stringify({app:'cornerstone-rentals',version:1,exportedAt:new Date().toISOString(),config:state.config,months:state.months},null,1);}
var pendingRender=false, saveState='idle', saveErr=null;

function unitById(id){for(var i=0;i<state.config.units.length;i++){if(state.config.units[i].id===id)return state.config.units[i];}return null;}
function sortedMonths(){return Object.keys(state.months).sort();}
function ratesFor(mid){var m=state.months[mid];return (m&&m.rates)?m.rates:state.config.rates;}
function entry(mid,uid){var m=state.months[mid];return (m&&m.entries&&m.entries[uid])||{};}
function ensureMonth(mid){
  if(!state.months[mid])state.months[mid]={entries:{},rates:clone(state.config.rates)};
  if(!state.months[mid].entries)state.months[mid].entries={};
  if(!state.months[mid].rates)state.months[mid].rates=clone(state.config.rates);
  return state.months[mid];
}
function prevReading(mid,uid){
  var ids=sortedMonths().filter(function(i){return i<mid;}).reverse();
  for(var i=0;i<ids.length;i++){var v=num(entry(ids[i],uid).cur);if(v!==null)return {v:v,month:ids[i]};}
  return null;
}
function lastRent(mid,uid){
  var ids=sortedMonths().filter(function(i){return i<mid;}).reverse();
  for(var i=0;i<ids.length;i++){var v=num(entry(ids[i],uid).rent);if(v!==null)return v;}
  return null;
}

/* ---------- billing maths ---------- */
function calc(mid,uid){
  var u=unitById(uid), e=entry(mid,uid), r=ratesFor(mid);
  var pr=prevReading(mid,uid);
  var cur=num(e.cur), rent=num(e.rent), paid=num(e.paid)||0;
  var used=null, water=null, err=null;
  if(cur!==null&&pr){
    used=cur-pr.v;
    if(used<0){err='low';}else{water=used*r.water;}
  }else if(cur!==null){water=0;}
  var trash=r.trash, wifi=(u&&u.wifi)?r.wifi:0;
  var total=null;
  if(cur!==null&&rent!==null&&!err)total=rent+(water||0)+trash+wifi;
  var balance=total===null?null:Math.max(0,total-paid);
  var over=total!==null&&paid>total?paid-total:0;
  var status='pending';
  if(total!==null)status=paid>=total?'paid':(paid>0?'part':'unpaid');
  return {cur:cur,rent:rent,prev:pr?pr.v:null,prevMonth:pr?pr.month:null,used:used,water:water,trash:trash,wifi:wifi,total:total,paid:paid,balance:balance,over:over,status:status,err:err,rates:r};
}
function summary(mid){
  var s={billed:0,collected:0,out:0,n:0,paidN:0};
  state.config.units.forEach(function(u){
    var c=calc(mid,u.id);if(c.total===null)return;
    s.n++;s.billed+=c.total;s.collected+=Math.min(c.paid,c.total);s.out+=c.balance;if(c.status==='paid')s.paidN++;
  });
  return s;
}
function attention(mid,house){
  var n=0;
  state.config.units.forEach(function(u){if(u.house!==house)return;var c=calc(mid,u.id);if(c.status==='unpaid'||c.status==='part')n++;});
  return n;
}
function outstandingList(){
  var out=[];
  sortedMonths().forEach(function(mid){
    state.config.units.forEach(function(u){
      var c=calc(mid,u.id);
      if(c.total!==null&&c.balance>0)out.push({mid:mid,u:u,c:c});
    });
  });
  return out;
}

/* ---------- saving ---------- */
var timers={}, inflight={}, dirty={};
function anyBusy(){return Object.keys(dirty).length>0||Object.keys(inflight).length>0;}
function setSave(s,err){saveState=s;saveErr=err||null;paintFoot();}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({config:state.config,months:state.months}));}catch(e){}}
function queueWrite(key){
  if(readOnly)return;
  dirty[key]=true;setSave('saving');
  clearTimeout(timers[key]);
  timers[key]=setTimeout(function(){flush(key);},450);
}
async function flush(key){
  if(inflight[key]){timers[key]=setTimeout(function(){flush(key);},300);return;}
  if(!dirty[key])return;
  delete dirty[key];inflight[key]=true;
  var failed=null;
  try{
    if(mode==='db'){
      if(key==='config')await dbh.doc('config/main').set(clone(state.config));
      else{var id=key.slice(2);if(state.months[id])await dbh.doc('months/'+id).set(clone(state.months[id]));}
    }else if(mode==='sb'){
      var payload=key==='config'?state.config:state.months[key.slice(2)];
      if(payload){
        var up=await sb.from('records').upsert({key:key,data:clone(payload),updated_at:new Date().toISOString()});
        if(up.error)throw up.error;
      }
    }else{saveLocal();}
  }catch(e){failed=e;}
  delete inflight[key];
  if(failed){setSave('error',failed);}
  else if(!anyBusy()){setSave(saveErr?'error':'saved',saveErr);}
}
function locked(key){return !!(dirty[key]||inflight[key]);}

/* ---------- output text for a unit ---------- */
function outs(c,u,mid){
  var o={};
  o.prev=c.prev===null?'None':fmtN(c.prev);
  o.used=c.err?'Check':(c.used===null?'—':fmtN(c.used));
  o.total=c.total===null?'—':money(c.total);
  o.pill={pending:'Not billed yet',paid:'Paid',part:'Part paid',unpaid:'Not paid'}[c.status];
  var parts=[];
  if(c.cur===null)parts.push('Water waits for the reading');
  else if(c.prev===null)parts.push('No earlier reading, water not charged');
  else if(c.err)parts.push('Water cannot be worked out yet');
  else parts.push('Water '+fmtN(c.used)+' × '+c.rates.water+' = '+money(c.water));
  parts.push('Trash '+money(c.trash));
  if(c.wifi)parts.push('Wifi '+money(c.wifi));
  o.brk=parts.join('  ·  ');
  o.warn=c.err?('Reading is lower than the last one ('+fmtN(c.prev)+'). Check it, or fix '+monthLabel(c.prevMonth)+' if that figure was a typo.'):'';
  if(c.total===null)o.owes='Needs reading and rent';
  else if(c.balance>0)o.owes='Owes '+money(c.balance);
  else if(c.over>0)o.owes='Overpaid '+money(c.over);
  else o.owes='Cleared';
  return o;
}

function render(){

  var needLogin=(mode==='sb'&&!sbSession);
  $('.stepper').hidden=needLogin;

  paintTabs();paintStepper();paintFoot();
  if(!ready){view.innerHTML='<p class="empty">Opening the records…</p>';return;}
  if(ui.tab==='billing')renderBilling();
  else if(ui.tab==='unpaid')renderUnpaid();

function renderIfIdle(){
  var a=document.activeElement;

  render();
}
var toastTimer=null;

}

/* ---------- events ---------- */
$('#tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]');if(!b)return;
  ui.tab=b.dataset.tab;render();
});
$('#m-prev').addEventListener('click',function(){ui.month=shiftMonth(ui.month,-1);render();});
$('#m-next').addEventListener('click',function(){ui.month=shiftMonth(ui.month,1);render();});

view.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.f){
    var card=t.closest('[data-u]');if(!card||readOnly)return;
    var uid=card.dataset.u, f=t.dataset.f;
    var m=ensureMonth(ui.month);
    var en=m.entries[uid]||(m.entries[uid]={});
    en[f]=num(t.value.replace(/,/g,'').trim());
    if(f==='cur'&&en.rent==null){
      var lr=lastRent(ui.month,uid);
      if(lr!==null){en.rent=lr;card.querySelector('[data-f="rent"]').value=lr;}
    }
    patchCard(card);patchSummary();queueWrite('m:'+ui.month);
  }
});
view.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='restore-file'){
    var bf=t.files&&t.files[0];if(!bf)return;
    var rdr=new FileReader();
    rdr.onload=function(){
      try{
        var b=JSON.parse(rdr.result);
        if(!b||b.app!=='cornerstone-rentals'||!b.months||typeof b.months!=='object'||!b.config||!Array.isArray(b.config.units))throw new Error('bad');
        var n=Object.keys(b.months).length;
        pendingBackup={data:b,info:'Backup made '+(b.exportedAt?new Date(b.exportedAt).toLocaleString('en-GB'):'on an unknown date')+', with '+n+' month(s) of records and '+b.config.units.length+' units.'};
      }catch(ex){pendingBackup=null;toast('That file is not a Cornerstone backup.');}
      t.value='';render();
    };
    rdr.readAsText(bf);
  }
  else if(t.id==='hist-unit'){ui.histUnit=t.value;render();}
  else if(t.dataset.wifi){var u=unitById(t.dataset.wifi);if(u){u.wifi=t.checked;queueWrite('config');}}
});
view.addEventListener('focusout',function(){
  setTimeout(function(){
    var a=document.activeElement;
    if(pendingRender&&!(a&&view.contains(a)&&(a.tagName==='INPUT'||a.tagName==='SELECT')))render();
  },0);
});
view.addEventListener('click',function(e){
  var h=e.target.closest('[data-house]');
  if(h){ui.house=h.dataset.house;render();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act;
  if(act==='paid'||act==='unpaid'){
    var uid=b.closest('[data-u]').dataset.u, c=calc(ui.month,uid);
    if(act==='paid'&&c.total===null){toast('Enter the reading and rent first.');return;}
    var en=ensureMonth(ui.month).entries[uid]||(state.months[ui.month].entries[uid]={});
    en.paid=act==='paid'?c.total:0;
    queueWrite('m:'+ui.month);render();
  }else if(act==='copyrents'){
    var m=ensureMonth(ui.month),cnt=0;
    state.config.units.forEach(function(u){
      var en2=m.entries[u.id]||(m.entries[u.id]={});
      if(num(en2.rent)===null){var lr=lastRent(ui.month,u.id);if(lr!==null){en2.rent=lr;cnt++;}}
    });
    queueWrite('m:'+ui.month);render();toast('Copied rent for '+cnt+' units.');
  }else if(act==='open'){
    ui.month=b.dataset.m;var u2=unitById(b.dataset.u);if(u2)ui.house=u2.house;ui.tab='billing';render();
    var card=document.getElementById('card-'+b.dataset.u);if(card)card.scrollIntoView({block:'center'});
  }else if(act==='copylist'){
    var text=reminderText(outstandingList());
    var done=function(){toast('List copied.');};
    var fallback=function(){var w=$('#copywrap'),bx=$('#copybox');w.hidden=false;bx.value=text;bx.focus();bx.select();};
    try{navigator.clipboard.writeText(text).then(done,fallback);}catch(err){fallback();}
  }else if(act==='bkdownload'){
    var btxt=makeBackup(), bname='cornerstone-backup-'+new Date().toISOString().slice(0,10)+'.json';
    try{
      var blob=new Blob([btxt],{type:'application/json'}), burl=URL.createObjectURL(blob), ba=document.createElement('a');
      ba.href=burl;ba.download=bname;document.body.appendChild(ba);ba.click();document.body.removeChild(ba);
      setTimeout(function(){URL.revokeObjectURL(burl);},2000);
      try{localStorage.setItem('cornerstone-last-backup',new Date().toLocaleString('en-GB'));}catch(e5){}
      toast('Backup file created.');
    }catch(e6){toast('Could not create the file. Use Copy backup text.');}
  }else if(act==='bkcopy'){
    var ctext=makeBackup();
    var cdone=function(){toast('Backup text copied.');};
    var cfall=function(){var bx=$('#backupbox');bx.hidden=false;bx.value=ctext;bx.focus();bx.select();};
    try{navigator.clipboard.writeText(ctext).then(cdone,cfall);}catch(e7){cfall();}
  }else if(act==='bkpick'){
    $('#restore-file').click();
  }else if(act==='bkcancel'){
    pendingBackup=null;render();
  }else if(act==='bkrestore'){
    var bd=pendingBackup&&pendingBackup.data;if(!bd)return;
    state.config=normCfg(bd.config);queueWrite('config');
    Object.keys(bd.months).forEach(function(id){
      if(!/^\d{4}-\d{2}$/.test(id))return;
      var mo=clone(bd.months[id]||{});
      if(!mo.entries)mo.entries={};
      if(!mo.rates)mo.rates=clone(state.config.rates);
      state.months[id]=mo;queueWrite('m:'+id);
    });
    pendingBackup=null;render();toast('Backup restored.');
  }else if(act==='signout'){
    if(sb)sb.auth.signOut().then(function(){sbSession=null;ready=false;render();});
  }else if(act==='importlocal'){
    var saved=null;
    try{saved=JSON.parse(localStorage.getItem(LS_KEY));}catch(err2){}
    if(!saved||!saved.months){toast('Nothing is saved on this device.');return;}
    var touched=0;
    Object.keys(saved.months).forEach(function(id){
      var lm=saved.months[id];if(!lm||!lm.entries)return;
      var mm=ensureMonth(id), changed=false;
      Object.keys(lm.entries).forEach(function(uid){
        var le=lm.entries[uid], ce=mm.entries[uid];
        if(!ce){mm.entries[uid]=clone(le);changed=true;return;}
        if(num(ce.cur)===null&&num(le.cur)!==null){ce.cur=le.cur;changed=true;}
        if(num(ce.rent)===null&&num(le.rent)!==null){ce.rent=le.rent;changed=true;}
        if(num(ce.paid)===null&&num(le.paid)!==null){ce.paid=le.paid;changed=true;}
      });
      if(changed){queueWrite('m:'+id);touched++;}
    });
    toast(touched?('Uploaded missing records for '+touched+' month(s).'):'Nothing new to upload.');
    render();
  }else if(act==='saverates'){
    var rd=function(id){return num($(id).value.replace(/,/g,'').trim());};
    var nw=rd('#rate-water'), nt=rd('#rate-trash'), nf=rd('#rate-wifi');
    if(nw===null||nt===null||nf===null||nw<0||nt<0||nf<0){toast('Enter all three prices as numbers.');return;}
    var from=$('#rate-from').value;
    state.config.rates={water:nw,trash:nt,wifi:nf};queueWrite('config');
    sortedMonths().forEach(function(id){
      if(id>=from){state.months[id].rates={water:nw,trash:nt,wifi:nf};queueWrite('m:'+id);}
    });
    render();toast('Prices updated from '+monthLabel(from)+'.');
  }else if(act==='addunit'){
    var house=$('#nu-house').value, name=$('#nu-name').value.trim().toUpperCase();
    if(!name){toast('Type a unit label first.');return;}
    var id=house+'-'+name.replace(/[^A-Z0-9]/g,'');
    if(id.length<3||unitById(id)){toast('That unit already exists.');return;}
    state.config.units.push({id:id,house:house,name:name,wifi:house==='B'});
    queueWrite('config');render();toast('Added unit '+name+'.');
  }
});

/* ---------- online storage (Supabase), used only when the host page sets window.__SB ---------- */
view.addEventListener('submit',async function(e){
  if(e.target.id!=='login-form')return;
  e.preventDefault();
  var btn=$('#lg-btn'), err=$('#lg-err');
  btn.disabled=true;err.hidden=true;
  var res=null;
  try{res=await sb.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-pass').value});}catch(ex){res={error:ex};}
  if(res.error||!res.data||!res.data.session){
    err.textContent='Could not sign in. Check the email and password, and the internet connection.';
    err.hidden=false;btn.disabled=false;return;
  }
  sbSession=res.data.session;
  await afterSignIn();
});
async function sbLoad(){
  var r=await sb.from('records').select('key,data');
  if(r.error)throw r.error;
  var rows=r.data||[], hasCfg=false, hasMonths=false, seen={};
  rows.forEach(function(row){
    if(row.key==='config'){hasCfg=true;if(!locked('config'))state.config=normCfg(row.data);}
    else if(String(row.key).indexOf('m:')===0){
      var id=row.key.slice(2);hasMonths=true;seen[id]=true;
      if(!locked(row.key)){var d=clone(row.data||{});if(!d.entries)d.entries={};state.months[id]=d;}
    }
  });
  Object.keys(state.months).forEach(function(id){if(!seen[id]&&!locked('m:'+id))delete state.months[id];});
  if(!hasCfg){state.config=defaultConfig();queueWrite('config');}
  if(!hasMonths){state.months[BASE_MONTH]=seedMonth();queueWrite('m:'+BASE_MONTH);}
}
async function afterSignIn(){
  try{await sbLoad();}catch(e){toast('Could not load the records. Check the internet connection and reload.');}
  ready=true;render();
}
async function sbRefresh(){
  if(mode!=='sb'||!sbSession||!ready||anyBusy())return;
  var before=JSON.stringify([state.config,state.months]);
  try{await sbLoad();}catch(e){return;}
  if(JSON.stringify([state.config,state.months])!==before)renderIfIdle();
}
async function startSb(){
  mode='sb';sbChecking=true;render();
  sb=window.supabase.createClient(window.__SB.url,window.__SB.key);
  try{var g=await sb.auth.getSession();sbSession=(g&&g.data&&g.data.session)||null;}catch(e){sbSession=null;}
  sbChecking=false;
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){sbSession=null;ready=false;render();}});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)sbRefresh();});
  setInterval(sbRefresh,45000);
  if(sbSession)await afterSignIn();else render();
}

/* ---------- storage start-up ---------- */
function startLocal(){
  mode='local';
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem(LS_KEY));}catch(e){}
  if(saved&&saved.config&&saved.months){state.config=normCfg(saved.config);state.months=saved.months;}
  else{state.config=defaultConfig();state.months={};state.months[BASE_MONTH]=seedMonth();saveLocal();}
  ready=true;render();
}
function startDb(db){
  mode='db';dbh=db;
  var got={cfg:false,months:false}, def={cfg:false,months:false}, exists=false, empty=true, seeded=false;
  function trySeed(){
    if(seeded||readOnly||!def.cfg||!def.months)return;
    seeded=true;
    if(!exists){state.config=defaultConfig();queueWrite('config');}
    if(empty){state.months[BASE_MONTH]=seedMonth();queueWrite('m:'+BASE_MONTH);}
    if(!exists||empty)renderIfIdle();
  }
  function after(){if(got.cfg&&got.months){ready=true;renderIfIdle();trySeed();}}
  var fail=function(){if(!ready){ready=true;render();}};
  db.doc('config/main').onSnapshot(function(snap){
    got.cfg=true;def.cfg=!snap.metadata.fromCache;exists=snap.exists;
    if(snap.exists&&!locked('config'))state.config=normCfg(snap.data());
    after();
  },fail);
  db.collection('months').onSnapshot(function(snap){
    got.months=true;def.months=!snap.metadata.fromCache;empty=snap.size===0;
    var seen={};
    snap.docs.forEach(function(d){
      seen[d.id]=true;
      if(locked('m:'+d.id))return;
      var data=clone(d.data()||{});
      if(!data.entries)data.entries={};
      state.months[d.id]=data;
    });
    Object.keys(state.months).forEach(function(id){if(!seen[id]&&!locked('m:'+id)&&def.months)delete state.months[id];});
    after();
  },fail);
}
async function boot(){
  if(window.__SB){
    if(window.supabase&&typeof window.supabase.createClient==='function'){startSb();}
    else{view.innerHTML='<p class="empty">The online service could not load. Check the internet connection and reload the page.</p>';}
    return;
  }
  render();
  var db=null,user=null;
  var c=window.claude;
  if(c&&typeof c.use==='function'){
    try{
      var res=await Promise.race([Promise.all([c.use('db'),c.use('user')]),new Promise(function(r){setTimeout(function(){r([null,null]);},8000);})]);
      db=res[0];user=res[1];
    }catch(e){db=null;}
  }
  if(db&&user&&typeof user.can==='function'){
    try{var ok=await user.can('data.write');if(ok===false)readOnly=true;}catch(e){}
  }
  if(db)startDb(db);else startLocal();
}
boot();
})();
